name: Build and Release Capacitor Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 22 (strictly required by Capacitor CLI)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Set up JDK 21 (required by Capacitor Android target source release 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 4. Install npm dependencies
      - name: Install npm dependencies
        run: npm install

      # 5. Build web assets
      - name: Build web assets
        run: npm run build

      # 6. Sync web assets to Android platform
      - name: Sync web assets to Android
        run: npx cap sync android

      # 7. Grant execute permission to gradlew
      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # 8. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 9. Create GitHub Release and attach APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
